<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-label="AI Reels: scroll-stopping vertical videos, built in code">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0A12"/>
      <stop offset="1" stop-color="#14101F"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.18" cy="0.2" r="0.55">
      <stop offset="0" stop-color="#FF5A1F" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FF5A1F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.9" cy="0.85" r="0.6">
      <stop offset="0" stop-color="#7B5CFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7B5CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#FFD7C2"/>
      <stop offset="1" stop-color="#FF7A3D"/>
    </linearGradient>
    <linearGradient id="s1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF7A3D"/><stop offset="1" stop-color="#C2185B"/></linearGradient>
    <linearGradient id="s2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2BD9FE"/><stop offset="1" stop-color="#4E4BFF"/></linearGradient>
    <linearGradient id="s3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD23F"/><stop offset="1" stop-color="#FF5A1F"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <clipPath id="p1"><rect x="0" y="0" width="150" height="300" rx="22"/></clipPath>
    <clipPath id="p2"><rect x="0" y="0" width="150" height="300" rx="22"/></clipPath>
    <clipPath id="p3"><rect x="0" y="0" width="150" height="300" rx="22"/></clipPath>
    <style>
      .t { font-family: 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
      .float1 { animation: f 6s ease-in-out infinite; }
      .float2 { animation: f 6s ease-in-out -2s infinite; }
      .float3 { animation: f 6s ease-in-out -4s infinite; }
      @keyframes f { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-12px) } }
      .bar { animation: grow 3.2s cubic-bezier(.16,1,.3,1) infinite; transform-origin: 0 0; }
      @keyframes grow { 0% { transform: scaleX(0) } 70%,100% { transform: scaleX(1) } }
      .blink { animation: b 1.2s steps(2) infinite; }
      @keyframes b { 50% { opacity: 0 } }
      .pulse { animation: p 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes p { 0%,100% { transform: scale(1); opacity: .9 } 50% { transform: scale(1.18); opacity: .5 } }
    </style>
  </defs>

  <rect width="1280" height="520" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="520" rx="28" fill="url(#grid)"/>
  <rect width="1280" height="520" rx="28" fill="url(#glowA)"/>
  <rect width="1280" height="520" rx="28" fill="url(#glowB)"/>

  <!-- left: copy -->
  <g class="t">
    <g transform="translate(72 104)">
      <rect width="196" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.14"/>
      <circle cx="20" cy="17" r="5" fill="#FF5A1F" class="pulse"/>
      <text x="34" y="22.5" font-size="14" font-weight="600" fill="#F3EEFF" letter-spacing="0.4">CLAUDE CODE SKILL</text>
    </g>
    <text x="68" y="248" font-size="118" font-weight="900" fill="url(#title)" letter-spacing="-4">AI Reels</text>
    <text x="72" y="300" font-size="26" font-weight="600" fill="#FFFFFF" fill-opacity="0.92">Scroll-stopping Reels, TikToks &amp; Shorts.</text>
    <text x="72" y="336" font-size="26" font-weight="600" fill="#FFFFFF" fill-opacity="0.55">Built in code. Rendered on your machine.</text>

    <g transform="translate(72 382)">
      <rect width="150" height="44" rx="12" fill="#FF5A1F"/>
      <text x="75" y="28.5" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">15 formats</text>
      <rect x="164" width="188" height="44" rx="12" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.16"/>
      <text x="258" y="28.5" font-size="16" font-weight="700" fill="#F3EEFF" text-anchor="middle">0 AI video models</text>
      <rect x="366" width="150" height="44" rx="12" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.16"/>
      <text x="441" y="28.5" font-size="16" font-weight="700" fill="#F3EEFF" text-anchor="middle">100% local</text>
    </g>
    <text x="72" y="468" font-size="14" font-weight="600" fill="#FFFFFF" fill-opacity="0.42" letter-spacing="1.6">HYPERFRAMES · THREE.JS · BLENDER · ELEVENLABS</text>
  </g>

  <!-- right: three phones -->
  <g transform="translate(742 96)">
    <!-- phone 1: toon POV -->
    <g class="float1">
      <g transform="translate(0 40) rotate(-7)">
        <rect x="-8" y="-8" width="166" height="316" rx="30" fill="#0A0A0F" stroke="#FFFFFF" stroke-opacity="0.18"/>
        <g clip-path="url(#p1)">
          <rect width="150" height="300" fill="#C9B98F"/>
          <rect y="150" width="150" height="150" fill="#5B574F"/>
          <path d="M75 150 L40 300 M75 150 L110 300" stroke="#F2C230" stroke-width="5"/>
          <circle cx="28" cy="126" r="24" fill="#3F8F4E" stroke="#111" stroke-width="3"/>
          <circle cx="124" cy="118" r="28" fill="#E39A2C" stroke="#111" stroke-width="3"/>
          <rect x="62" y="158" width="26" height="46" rx="8" fill="#E7B12A" stroke="#111" stroke-width="3"/>
          <circle cx="75" cy="146" r="15" fill="#1D1A17" stroke="#111" stroke-width="3"/>
          <path d="M-10 300 Q20 250 60 262 L70 300Z" fill="#7C7C86" stroke="#111" stroke-width="3"/>
          <text x="10" y="98" font-family="Inter, Segoe UI, Arial" font-size="17" font-weight="900" fill="#fff">DAY 1</text>
          <rect x="30" y="226" width="90" height="16" rx="4" fill="#000" fill-opacity="0.35"/>
          <text x="75" y="238" font-family="Inter, Segoe UI, Arial" font-size="10" font-weight="800" fill="#FFD23F" text-anchor="middle">Where is everybody?</text>
        </g>
      </g>
    </g>
    <!-- phone 2: product hero -->
    <g class="float2">
      <g transform="translate(168 0)">
        <rect x="-8" y="-8" width="166" height="316" rx="30" fill="#0A0A0F" stroke="#FFFFFF" stroke-opacity="0.24"/>
        <g clip-path="url(#p2)">
          <rect width="150" height="300" fill="#101018"/>
          <circle cx="75" cy="120" r="90" fill="url(#s2)" opacity="0.35"/>
          <rect x="40" y="58" width="70" height="130" rx="14" fill="#1C1C26" stroke="#2BD9FE" stroke-opacity="0.6" stroke-width="2"/>
          <rect x="48" y="70" width="54" height="34" rx="6" fill="#3A2A20"/>
          <circle cx="58" cy="80" r="4" fill="#FF7A3D"/><circle cx="70" cy="80" r="4" fill="#FF7A3D"/><circle cx="82" cy="80" r="4" fill="#FF7A3D"/>
          <circle cx="58" cy="93" r="4" fill="#5A4436"/><circle cx="70" cy="93" r="4" fill="#5A4436"/><circle cx="82" cy="93" r="4" fill="#5A4436"/>
          <text x="75" y="232" font-family="Inter, Segoe UI, Arial" font-size="20" font-weight="900" fill="#fff" text-anchor="middle">NO APP.</text>
          <rect x="22" y="250" width="106" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.12"/>
          <rect x="22" y="250" width="106" height="8" rx="4" fill="url(#s2)" class="bar"/>
        </g>
      </g>
    </g>
    <!-- phone 3: you decide -->
    <g class="float3">
      <g transform="translate(336 40) rotate(7)">
        <rect x="-8" y="-8" width="166" height="316" rx="30" fill="#0A0A0F" stroke="#FFFFFF" stroke-opacity="0.18"/>
        <g clip-path="url(#p3)">
          <rect width="150" height="300" fill="#0E1426"/>
          <text x="75" y="70" font-family="Inter, Segoe UI, Arial" font-size="16" font-weight="900" fill="#fff" text-anchor="middle">WHAT DO</text>
          <text x="75" y="90" font-family="Inter, Segoe UI, Arial" font-size="16" font-weight="900" fill="#fff" text-anchor="middle">YOU DO?</text>
          <rect x="18" y="112" width="114" height="38" rx="8" fill="#1B2240" stroke="#4E8BFF" stroke-width="2"/>
          <text x="36" y="136" font-family="Inter, Segoe UI, Arial" font-size="13" font-weight="900" fill="#4E8BFF">A</text>
          <rect x="50" y="127" width="66" height="7" rx="3" fill="#fff" fill-opacity="0.7"/>
          <rect x="18" y="160" width="114" height="38" rx="8" fill="#2A2210" stroke="#FFD23F" stroke-width="2"/>
          <text x="36" y="184" font-family="Inter, Segoe UI, Arial" font-size="13" font-weight="900" fill="#FFD23F">B</text>
          <rect x="50" y="175" width="54" height="7" rx="3" fill="#fff" fill-opacity="0.7"/>
          <text x="75" y="226" font-family="Inter, Segoe UI, Arial" font-size="10" font-weight="800" fill="#fff" fill-opacity="0.8" text-anchor="middle">COMMENT A OR B</text>
          <rect x="30" y="242" width="90" height="22" rx="11" fill="#E5333D"/>
          <text x="75" y="257" font-family="Inter, Segoe UI, Arial" font-size="9.5" font-weight="900" fill="#fff" text-anchor="middle">FOLLOW FOR PART 2</text>
          <circle cx="128" cy="24" r="5" fill="#E5333D" class="blink"/>
        </g>
      </g>
    </g>
  </g>
</svg>
